[package]
name = "ops-telemetry-mcp"
description = "Custom MCP server exposing simulated logs, deployments, runbooks and incident tickets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# MCP server side: tool macros, JSON-schema generation, stdio transport.
rmcp = { workspace = true, features = ["server", "macros", "schemars", "transport-io"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-std", "sync"] }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
rusqlite.workspace = true
chrono.workspace = true

[dev-dependencies]
tempfile.workspace = true
yaml-rust2.workspace = true   # mock-data validation only (tests/mock_data.rs)
# MCP-level integration tests start the real binary and talk to it as a client.
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process"] }

[lints]
workspace = true

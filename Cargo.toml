# Cargo workspace: builds the telemetry MCP server and the agent orchestrator
# together, with one Cargo.lock and one shared target/ folder.
[workspace]
resolver = "3"
members = ["mcp-server", "agent-client"]

# Settings every member crate inherits with `xxx.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"   # rmcp 3.11 requires at least 1.88
publish = false

# Central version list. A crate only compiles the entries it actually uses,
# so versions planned for later phases cost nothing until then.
[workspace.dependencies]
# --- used from Phase 1 ---
anyhow = "1.0.105"
thiserror = "2.0.21"
dotenvy = "0.15.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tempfile = "3.27.0"
# --- planned for later phases (see docs/PHASE_0_DESIGN.md §5) ---
rmcp = { version = "=3.11.0", default-features = false }
tokio = "1.54.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
schemars = "1.2.3"
rusqlite = { version = "0.43.0", features = ["bundled"] }
chrono = { version = "0.4.45", features = ["serde"] }
# TLS backend decided in Phase 5: 0.13's rustls uses aws-lc-rs (may need CMake/NASM
# on Windows); native-tls (Windows SChannel) needs no extra build tools.
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
clap = { version = "4.6.9", features = ["derive"] }
sha2 = "0.11.1"

# Lints shared by all crates (each crate opts in with `[lints] workspace = true`).
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
unwrap_used = "warn"

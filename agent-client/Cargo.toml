[package]
name = "agent-client"
description = "Incident triage & release readiness agent: Claude + MCP orchestrator CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
dotenvy.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# MCP client side: spawn servers as child processes and talk over stdio.
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "io-util", "io-std", "time", "sync", "signal", "net"] }
serde.workspace = true
serde_json.workspace = true
# Claude Messages API over HTTPS (no official Rust SDK exists).
reqwest.workspace = true
# Approval binding (payload hash) and trace timestamps.
sha2.workspace = true
chrono.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Security tests read the ticket database directly to prove what was (not) created.
rusqlite.workspace = true

[lints]
workspace = true

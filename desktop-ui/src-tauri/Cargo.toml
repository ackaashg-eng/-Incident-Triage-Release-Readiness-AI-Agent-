[package]
name = "desktop-ui"
version = "0.1.0"
description = "Tauri UI for Incident Triage & Release Readiness AI Agent"
edition = "2024"

[workspace]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
tauri = { version = "2.2.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
sha2 = "0.11.1"
chrono = { version = "0.4.45", features = ["serde"] }

# Link to internal workspace libraries if needed
# agent-client = { path = "../agent-client" }
# ops-telemetry-mcp = { path = "../mcp-server" }
